name: Build ImmortalWrt 25.12 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          # 克隆 25.12 仓库源码
          git clone https://github.com/tfnhui/immortalwrt-mt798x-25.12.git openwrt
          cd openwrt
          
          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 直接复制配置文件
          cp defconfig/rax3000m-openclash.config .config

          # 生成完整配置（被注释了）
          # make defconfig
          
          # 验证 OpenClash（被注释了）
          # grep CONFIG_PACKAGE_luci-app-openclash .config || { echo "::error::OpenClash is NOT selected!"; exit 1; }

          # 下载编译所需的源码包
          make download -j$(nproc)

          # 开始编译
          make -j$(nproc)
          
          # 删除 packages 目录（不需要上传）
          rm -rf bin/targets/mediatek/filogic/packages
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: warn

      # ✅ 修正：这是一个独立的新步骤，需要正确缩进
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "ImmortalWrt 固件 Build #${{ github.run_number }}"
          tag_name: "build-${{ github.run_number }}-${{ github.run_id }}"
          body: |
            ## 自动编译固件
            
            - 编译编号：#${{ github.run_number }}
            - 设备：CMCC RAX3000M (eMMC)
            - 内核：6.6
            - 包含插件：OpenClash、磁盘管理、Argon 主题等
          files: |
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
