name: Build ImmortalWrt 25.12 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Build firmware
        run: |
          # 克隆 25.12 仓库源码
          git clone https://github.com/tfnhui/immortalwrt-mt798x-25.12.git openwrt
          cd openwrt

          # 将您的完整配置文件内容写入
          cat > .config << 'EOF'
          # 请将您上面提供的完整 .config 内容粘贴到这里
          # 从 CONFIG_MODULES=y 到最后一个配置项
          EOF

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 生成完整配置
          make defconfig

          # 下载编译所需的源码包
          make download -j8

          # 开始编译
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: warn
