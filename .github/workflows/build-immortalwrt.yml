name: Build ImmortalWrt RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Free disk space
        run: |
          sudo rm -rf /etc/localtime
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' '^php.*' azure-cli firefox powershell
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Build firmware
        run: |
          # 1. 克隆您指定的正确仓库（默认分支即为 25.12 版本）
          git clone https://github.com/tfnhui/immortalwrt-mt798x-25.12.git openwrt
          cd openwrt

          # 2. 添加您需要的插件源（feeds）
          echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf.default
          # Argon 主题和 Diskman 在官方 feeds 中可能已有，但为保险也添加其源
          echo "src-git argon https://github.com/jerrykuku/luci-theme-argon.git" >> feeds.conf.default
          echo "src-git diskman https://github.com/lisaac/luci-app-diskman.git" >> feeds.conf.default

          # 3. 更新并安装 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 4. 仅配置 RAX3000M 及所需插件
          cat > .config << 'EOF'
# 基本平台配置
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_mt7981=y
CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_cmcc_rax3000m=y

# 强制不编译其他设备
# CONFIG_TARGET_MULTI_PROFILES is not set
# CONFIG_TARGET_ALL_PROFILES is not set

# 核心组件
CONFIG_LUCI=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y

# 您需要的插件
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-diskman=y

# Diskman 依赖（建议加入，避免功能缺失）
CONFIG_PACKAGE_kmod-scsi-core=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_kmod-fs-vfat=y
CONFIG_PACKAGE_kmod-fs-ntfs=y
EOF

          # 5. 生成完整配置并开始编译
          make defconfig
          make download -j8
          # 先全速编译，失败则单核调试
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000M-ImmortalWrt-25.12
          # 仓库生成的固件文件名可能有所不同，这里使用更宽泛的通配符
          path: |
            openwrt/bin/targets/mediatek/mt7981/*.bin
            openwrt/bin/targets/mediatek/mt7981/*.itb
            openwrt/bin/targets/mediatek/mt7981/*.img
          if-no-files-found: error
