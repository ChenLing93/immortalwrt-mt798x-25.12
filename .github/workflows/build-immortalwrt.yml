name: Build ImmortalWrt 25.12 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          # 克隆 25.12 仓库源码
          git clone https://github.com/tfnhui/immortalwrt-mt798x-25.12.git openwrt
          cd openwrt

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 使用基础配置
          cp defconfig/mt7981-ax3000.config .config

          # 方法：用 sed 批量关闭所有设备，再单独开启 RAX3000M
          sed -i '/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/s/=y/=n/' .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m=y" >> .config
          
          # 确保关闭多设备编译模式（可选，但推荐）
          sed -i 's/CONFIG_TARGET_MULTI_PROFILE=y/CONFIG_TARGET_MULTI_PROFILE=n/' .config

          # 生成完整配置
          make defconfig

          # 验证配置是否正确（可选，会显示选中的设备）
          echo "=== 验证选中的设备 ==="
          grep "CONFIG_TARGET_DEVICE.*=y" .config | grep -v "PACKAGES"

          # 下载编译所需的源码包
          make download -j8

          # 开始编译
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/filogic/
