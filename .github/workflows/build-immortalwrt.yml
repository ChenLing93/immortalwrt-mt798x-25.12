name: Build ImmortalWrt RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Free disk space
        run: |
          sudo rm -rf /etc/localtime
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' '^php.*' azure-cli firefox powershell
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Build firmware
        run: |
          git clone https://github.com/tfnhui/immortalwrt-mt798x.git openwrt
          cd openwrt
          
          # 尝试切换分支，如果失败则继续
          git checkout 25.12 || echo "使用默认分支"
          
          # 添加插件源
          echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf.default
          echo "src-git argon https://github.com/jerrykuku/luci-theme-argon.git" >> feeds.conf.default
          
          # 创建文件预置目录
          mkdir -p files
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 只编译 RAX3000M 精简配置
          cat > .config << 'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_mt7981=y
CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_cmcc_rax3000m=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-diskman=y
EOF
          
          make defconfig
          make download -j8
          make -j$(nproc) || make -j1 V=s
          
          # 显示编译结果
          echo "编译完成的固件："
          ls -lh bin/targets/mediatek/mt7981/*.bin 2>/dev/null || echo "未找到 .bin 文件"
          ls -lh bin/targets/mediatek/mt7981/*.itb 2>/dev/null || echo "未找到 .itb 文件"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000M-ImmortalWrt-25.12
          path: |
            openwrt/bin/targets/mediatek/mt7981/*.bin
            openwrt/bin/targets/mediatek/mt7981/*.itb
            openwrt/bin/targets/mediatek/mt7981/*.img
          if-no-files-found: error
