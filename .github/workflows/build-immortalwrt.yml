name: Build ImmortalWrt 25.12 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          # 克隆 25.12 仓库源码
          git clone https://github.com/tfnhui/immortalwrt-mt798x-25.12.git openwrt
          cd openwrt

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 复制 RAX3000M 默认配置
          if [ -f defconfig/mt7981-ax3000.config ]; then
            cp defconfig/mt7981-ax3000.config .config
          elif [ -f defconfig/cmcc_rax3000m.config ]; then
            cp defconfig/cmcc_rax3000m.config .config
          else
            echo "未找到 RAX3000M 配置文件，请检查 defconfig 目录"
            ls defconfig/
            exit 1
          fi

          # 添加 OpenClash 软件源
          echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf.default

          # 添加 Argon 主题软件源
          echo "src-git argon https://github.com/jerrykuku/luci-theme-argon.git" >> feeds.conf.default

          # 更新新添加的 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # ===== 仅保留 RAX3000M 设备配置 =====
          # 禁用所有其他设备配置
          echo "CONFIG_TARGET_BOARD="mediatek"" >> .config
          echo "CONFIG_TARGET_SUBTARGET="mt7981"" >> .config
          echo "CONFIG_TARGET_PROFILE="CMCC_RAX3000M"" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_CMCC_RAX3000M=y" >> .config
          
          # 设置仅编译指定设备
          echo "CONFIG_TARGET_MULTI_PROFILE=n" >> .config
          echo "CONFIG_TARGET_ALL_PROFILES=n" >> .config
          echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y" >> .config

          # ===== 选中要集成的插件 =====
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> .config

          # 生成完整配置并进行依赖检查
          make defconfig
          
          # 可选：查看最终配置确认
          echo "=== 最终设备配置 ==="
          grep -E "CONFIG_TARGET|CONFIG_PACKAGE" .config | sort

          # 下载所有需要的源码包
          make download -j8 V=s

          # 开始编译（仅编译 RAX3000M）
          make -j$(nproc) V=s

          # 编译完成后显示输出文件
          echo "=== 编译完成，输出文件 ==="
          find bin/targets/ -name "*.bin" -o -name "*.itb" | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-rax3000m
          path: openwrt/bin/targets/mediatek/mt7981/
          if-no-files-found: error
